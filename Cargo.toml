[package]
name = "llm-chat"
version = "0.1.0"
edition = "2021"
authors = ["Nessim Ben Abbes"]
description = "A fast, minimal terminal app for LLM interactions"
license = "MIT"

[dependencies]
ratatui = "0.24.0"
crossterm = { version = "0.27.0", features = ["event-stream"] }
futures = "0.3"
tokio = { version = "1.35.1", features = ["full"] }
reqwest = { version = "0.11.23", features = ["json"] }
serde = { version = "1.0.195", features = ["derive"] }
serde_json = "1.0.111"
anyhow = "1.0.79"
toml = "0.8.8"
dirs = "5.0.1"
chrono = "0.4.31"
rusqlite = { version = "0.29", features = ["bundled", "chrono"] }
textwrap = "0.16"
copypasta = "0.10"
syntect = "5.1"
lazy_static = "1.4"
unicode-width = "0.1"
